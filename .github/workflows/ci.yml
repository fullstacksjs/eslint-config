name: CI

on:
  pull_request:
    branches:
      - main
      - next

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      - run: vp check
      - run: vp run spell
      - run: vp test run src
      - run: vp run check:rules
